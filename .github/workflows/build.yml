   name: Build ASI
   on:
     push:
     workflow_dispatch:
   jobs:
     build:
       runs-on: windows-latest
       steps:
         - uses: actions/checkout@v4
         - uses: ilammy/msvc-dev-cmd@v1
           with:
             arch: x86
         - name: Compile
           shell: cmd
           run: cl /nologo /LD /O2 /EHsc /MT nfsu2_gfx.cpp /Fe:NFSU2_GraphicsBoost.asi user32.lib
         - uses: actions/upload-artifact@v4
           with:
             name: NFSU2_GraphicsBoost
             path: |
               NFSU2_GraphicsBoost.asi
               NFSU2_GraphicsBoost.ini
