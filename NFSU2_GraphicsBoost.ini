[Main]
; Anisotropic filtering: 0 = kapali, 2 / 4 / 8 / 16
Anisotropy=16

; Mipmap filtresi POINT ise LINEAR yap (trilinear). 1 = acik
ForceTrilinear=1

; Mipmap LOD bias. 0 = dokunma. -0.5 gibi negatif deger dokulari keskinlestirir
; (cok dusuk deger titreme yapar)
MipLodBias=0

; MSAA: 0 = kapali, 2 / 4 / 8. Oyunun kendi AA ayari yerine zorlanir.
; Sorun cikarirsa (siyah ekran, bozuk yansima) 0 yap.
MSAA=0

; VSync: -1 = oyunun ayarini kullan, 0 = kapali, 1 = acik
VSync=-1

; Log dosyasi (NFSU2_GraphicsBoost.log) yaz. 1 = acik
Log=1
